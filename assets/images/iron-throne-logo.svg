      <path d="M1593 155 C 1623 119, 1629 84, 1615 52"/>

      <path d="M540 490 C 632 444, 712 423, 796 431 C 882 440, 942 475, 1013 470 C 1098 465, 1160 421, 1230 425 C 1302 429, 1363 474, 1441 468 C 1521 462, 1586 423, 1665 440"/>
