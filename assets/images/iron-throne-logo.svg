      <path d="M1348 508 C 1390 468, 1440 460, 1482 476"/>
    </g>

    <g fill="none" stroke="#f3f3f3" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity="0.9">
      <path d="M365 467 C 415 431, 473 425, 520 441"/>
      <path d="M1430 467 C 1480 431, 1538 425, 1585 441"/>
      <path d="M612 546 L 602 596"/>
      <path d="M745 538 L 738 591"/>
      <path d="M908 541 L 908 597"/>
      <path d="M1084 541 L 1087 597"/>
      <path d="M1254 538 L 1261 591"/>
      <path d="M1388 546 L 1399 596"/>
      <path d="M631 569 C 650 585, 669 591, 686 588"/>
      <path d="M883 586 C 904 600, 923 605, 942 601"/>
      <path d="M1052 585 C 1073 601, 1093 605, 1115 600"/>
      <path d="M1237 583 C 1258 599, 1280 604, 1302 600"/>
