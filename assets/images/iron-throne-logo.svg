      y="54%"
      text-anchor="middle"
      dominant-baseline="middle"
      font-size="390"
      font-weight="900"
      font-style="italic"
      letter-spacing="-18"
      font-family="Georgia, 'Times New Roman', serif"
      fill="url(#metalGradient)"
      stroke="#f8f8f8"
      stroke-opacity="0.9"
      stroke-width="5"
      paint-order="stroke fill"
      filter="url(#roughText)"
    >IRON THRONE</text>

    <g fill="none" stroke="#f4f4f4" stroke-width="4" stroke-linecap="round" opacity="0.75">
      <path d="M618 487 C 604 456, 604 427, 617 399"/>
      <path d="M772 486 C 767 453, 772 421, 787 389"/>
      <path d="M918 488 C 924 449, 938 420, 963 380"/>
