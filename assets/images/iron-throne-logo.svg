    <g opacity="0.82" filter="url(#sharpGlow)">
      <path d="M555 355 L 579 315 L 608 355 L 635 315 L 660 355 L 686 315 L 712 355" fill="none" stroke="#f4f4f4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
      <path d="M1088 355 L 1112 315 L 1141 355 L 1168 315 L 1193 355 L 1219 315 L 1245 355" fill="none" stroke="#f4f4f4" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
