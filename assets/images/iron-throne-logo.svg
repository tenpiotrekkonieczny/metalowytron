<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1800 700" role="img" aria-label="Iron Throne logo">
  <defs>
    <linearGradient id="metalGradient" x1="0%" x2="0%" y1="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="12%" stop-color="#dfe3e8"/>
      <stop offset="26%" stop-color="#f8f8f8"/>
      <stop offset="45%" stop-color="#bfc5cc"/>
      <stop offset="64%" stop-color="#f0f0f0"/>
      <stop offset="100%" stop-color="#ffffff"/>
    </linearGradient>

    <filter id="roughText" x="-15%" y="-15%" width="130%" height="130%">
      <feTurbulence type="fractalNoise" baseFrequency="1.15" numOctaves="2" seed="9" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="7" stdDeviation="12" flood-color="#ffffff" flood-opacity="0.24"/>
    </filter>

    <filter id="sharpGlow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="3" flood-color="#ffffff" flood-opacity="0.6"/>
    </filter>
  </defs>

  <g filter="url(#softShadow)">
    <g fill="none" stroke="#f3f3f3" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
      <path d="M246 257 C 145 181, 120 103, 149 22 C 192 33, 248 86, 282 156 C 300 193, 291 220, 246 257 Z"/>
      <path d="M219 251 C 162 205, 145 155, 165 100 C 198 122, 234 169, 251 214"/>
